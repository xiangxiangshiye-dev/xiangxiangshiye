<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自由 AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#222}
header{background:#5965df;color:white;padding:20px;text-align:center}
header h2{margin:0}
header p{margin:8px 0 0;font-size:13px}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 3px 15px #0000000d}
#chat{height:55vh;min-height:300px;overflow:auto;margin-bottom:14px}
.msg{padding:11px 14px;margin:10px 0;border-radius:12px;line-height:1.6;white-space:pre-wrap}
.ai{background:#f0f1ff;margin-right:35px}
.me{background:#dff8e9;margin-left:35px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:12px 16px;background:#5965df;color:white;font-size:15px}
.small{font-size:12px;color:#777;line-height:1.6}
</style>
</head>
<body>
<header>
<h2>自由 AI</h2>
<p>你的私人智能聊天空间</p>
</header>
<main>
<div class="card">
<div id="chat">
<div class="msg ai">你好！欢迎使用自由 AI。😊

我是你的聊天助手。当前为演示版本，尚未连接真正的 AI 服务。

你可以先试试发送消息，体验基本聊天界面。</div>
</div>
<div class="row">
<input id="input" placeholder="输入你想说的话..." autocomplete="off">
<button onclick="send()">发送</button>
</div>
<p class="small">提示：当前版本使用演示回复，不会连接在线 AI 服务。</p>
</div>
</main>
<script>
const input=document.getElementById('input');
const chat=document.getElementById('chat');
function send(){
 const text=input.value.trim();
 if(!text)return;
 const me=document.createElement('div');
 me.className='msg me';
 me.textContent=text;
 chat.appendChild(me);
 const reply=document.createElement('div');
 reply.className='msg ai';
 reply.textContent='我收到了你的消息：“'+text+'”\n\n目前还是演示版本。后续接入 AI 服务后，就可以进行真正的智能对话。';
 chat.appendChild(reply);
 input.value='';
 chat.scrollTop=chat.scrollHeight;
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
